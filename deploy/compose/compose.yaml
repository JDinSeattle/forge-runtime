services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: forge_admin
      POSTGRES_PASSWORD: forge_dev_only
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:${FORGE_POSTGRES_PORT:-0}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge_admin -d forge"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
