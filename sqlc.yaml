version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlgen
        out: internal/persistence/sqlgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
